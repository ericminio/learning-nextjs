<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMinYMid slice">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="spaceGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#050510"/>
    </radialGradient>
    
    <!-- Saturn body gradient -->
    <linearGradient id="saturnGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a86c"/>
      <stop offset="30%" style="stop-color:#e8d5a3"/>
      <stop offset="50%" style="stop-color:#f5e6c3"/>
      <stop offset="70%" style="stop-color:#d4b87a"/>
      <stop offset="100%" style="stop-color:#a08050"/>
    </linearGradient>
    
    <!-- Saturn glow -->
    <radialGradient id="saturnGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:rgba(255,200,150,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,200,150,0)"/>
    </radialGradient>
    
    <!-- Ring gradient -->
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(200,180,150,0.2)"/>
      <stop offset="30%" style="stop-color:rgba(220,200,170,0.5)"/>
      <stop offset="50%" style="stop-color:rgba(240,220,190,0.6)"/>
      <stop offset="70%" style="stop-color:rgba(220,200,170,0.5)"/>
      <stop offset="100%" style="stop-color:rgba(180,160,130,0.2)"/>
    </linearGradient>
    
    <!-- Inner ring gradient -->
    <linearGradient id="innerRingGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(180,160,140,0.1)"/>
      <stop offset="50%" style="stop-color:rgba(200,180,160,0.4)"/>
      <stop offset="100%" style="stop-color:rgba(160,140,120,0.1)"/>
    </linearGradient>

    <!-- Clip path for Saturn bands -->
    <clipPath id="saturnClip">
      <circle cx="350" cy="540" r="180"/>
    </clipPath>
  </defs>
  
  <!-- Deep space background -->
  <rect width="100%" height="100%" fill="url(#spaceGradient)"/>
  
  <!-- Stars -->
  <g fill="white">
    <circle cx="100" cy="80" r="1.2" opacity="0.8"/>
    <circle cx="250" cy="150" r="0.8" opacity="0.6"/>
    <circle cx="400" cy="60" r="1" opacity="0.7"/>
    <circle cx="550" cy="200" r="0.6" opacity="0.5"/>
    <circle cx="700" cy="100" r="1.4" opacity="0.9"/>
    <circle cx="850" cy="180" r="0.7" opacity="0.6"/>
    <circle cx="1000" cy="50" r="1.1" opacity="0.8"/>
    <circle cx="1150" cy="130" r="0.9" opacity="0.7"/>
    <circle cx="1300" cy="90" r="1.3" opacity="0.85"/>
    <circle cx="1450" cy="170" r="0.5" opacity="0.5"/>
    <circle cx="1600" cy="80" r="1" opacity="0.75"/>
    <circle cx="1750" cy="140" r="0.8" opacity="0.65"/>
    <circle cx="1850" cy="60" r="1.2" opacity="0.8"/>
    <circle cx="80" cy="300" r="0.9" opacity="0.7"/>
    <circle cx="200" cy="400" r="1.1" opacity="0.75"/>
    <circle cx="150" cy="550" r="0.7" opacity="0.6"/>
    <circle cx="50" cy="700" r="1.3" opacity="0.85"/>
    <circle cx="180" cy="800" r="0.6" opacity="0.5"/>
    <circle cx="100" cy="950" r="1" opacity="0.7"/>
    <circle cx="1800" cy="300" r="0.8" opacity="0.65"/>
    <circle cx="1700" cy="450" r="1.2" opacity="0.8"/>
    <circle cx="1850" cy="600" r="0.7" opacity="0.55"/>
    <circle cx="1750" cy="750" r="1.1" opacity="0.75"/>
    <circle cx="1820" cy="900" r="0.9" opacity="0.7"/>
    <circle cx="1650" cy="980" r="1.4" opacity="0.85"/>
    <circle cx="1400" cy="950" r="0.6" opacity="0.5"/>
    <circle cx="1200" cy="1000" r="1" opacity="0.7"/>
    <circle cx="1000" cy="980" r="0.8" opacity="0.6"/>
    <circle cx="800" cy="1020" r="1.2" opacity="0.8"/>
    <circle cx="600" cy="950" r="0.7" opacity="0.55"/>
    <circle cx="300" cy="1000" r="1.1" opacity="0.75"/>
  </g>
  
  <!-- Saturn glow effect -->
  <ellipse cx="350" cy="540" rx="350" ry="300" fill="url(#saturnGlow)"/>
  
  <!-- Back rings (behind planet) -->
  <ellipse cx="350" cy="540" rx="500" ry="90" fill="none" stroke="url(#ringGradient)" stroke-width="45" opacity="0.4"
           stroke-dasharray="0 280 800 0"/>
  <ellipse cx="350" cy="540" rx="420" ry="75" fill="none" stroke="url(#innerRingGradient)" stroke-width="25" opacity="0.3"
           stroke-dasharray="0 260 700 0"/>
  
  <!-- Saturn body -->
  <circle cx="350" cy="540" r="180" fill="url(#saturnGradient)"/>
  
  <!-- Saturn atmospheric bands -->
  <g clip-path="url(#saturnClip)" opacity="0.4">
    <rect x="170" y="400" width="360" height="12" fill="#b08c50"/>
    <rect x="170" y="430" width="360" height="18" fill="#c9a060"/>
    <rect x="170" y="470" width="360" height="8" fill="#a07840"/>
    <rect x="170" y="500" width="360" height="25" fill="#d4b070"/>
    <rect x="170" y="550" width="360" height="15" fill="#b89860"/>
    <rect x="170" y="590" width="360" height="10" fill="#a08050"/>
    <rect x="170" y="620" width="360" height="20" fill="#c4a468"/>
    <rect x="170" y="660" width="360" height="12" fill="#9c7848"/>
  </g>
  
  <!-- Front rings (in front of planet) -->
  <ellipse cx="350" cy="540" rx="500" ry="90" fill="none" stroke="url(#ringGradient)" stroke-width="45"
           stroke-dasharray="800 280 0 0"/>
  <ellipse cx="350" cy="540" rx="420" ry="75" fill="none" stroke="url(#innerRingGradient)" stroke-width="25"
           stroke-dasharray="700 260 0 0"/>
  
  <!-- Outer faint ring -->
  <ellipse cx="350" cy="540" rx="560" ry="100" fill="none" stroke="rgba(180,160,140,0.15)" stroke-width="15"
           stroke-dasharray="900 300 0 0"/>
  
  <!-- Subtle highlight on Saturn -->
  <ellipse cx="300" cy="480" rx="60" ry="80" fill="rgba(255,255,255,0.05)"/>
</svg>